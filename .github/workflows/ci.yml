name: TicketOPS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Laravel tests and Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install Composer dependencies
        working-directory: src
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate temporary application key
        run: echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

      - name: Run Laravel tests
        working-directory: src
        run: php artisan test

      - name: Build PHP Docker image
        run: docker build --tag ticketops-php:ci ./docker/php